[files]
ignore-dot   = true
ignore-files = true
# 忽略文件
extend-exclude = ["*.zsh", "modules/features/ai/skills/**"]

[default]
binary = false
# 自定义不可纠正的文本Custom uncorrectable sections (e.g. markdown code fences, PGP signatures, etc)
extend-ignore-re = [
  "iterm2",
  "Deactive",
  "Pn",
  "imput",    # helium
  "(?i)udid", # Apple 设备标识，不是 UUID 的拼写错误

  # catppuccin theme colors
  "11111b",
  "1e1e2e",
  "313244",
  "414356",
  "45475a",
  "585b70",
  "89b4fa",
  "94e2d5",
  "a6adc8",
  "a6e3a1",
  "bac2de",
  "cdd6f4",
  "f38ba8",
  "f5c2e7",
  "f5e0dc",
  "f9e2af",
  "fab387",

  "198c2ba3",

  # Nerd Font powerline 字形码点（modules/features/shell/starship.nix）
  "E0BA",
  "facter",

  # AstroNvim 的「最近文件」键位（modules/features/editor/neovim/config）
  "<leader>fo"
]
