          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.3-flash:
        reasoning: true
        input: ["text", "image"]
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: true
        compat:
