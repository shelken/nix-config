  cpa:
    baseUrl: http://192.168.69.60:8317/v1
    apiKey: CPA_PI_API_KEY
    api: openai-responses
    discovery:
      type: openai-models-list
    # 档位权威来源: cpa-plugins/plugins/workbuddy/data/static-config.json
    # 宿主 /v1/models 只回 id/object/created/owned_by, 无能力字段, 发现结果查内置目录会命中
    # 同名无关行 (如 hy3 命中 opencode-go 的 minimal..xhigh), 故在此逐 id 覆盖为上游真实档位。
    # omitReasoningEffort: false 必须显式声明: 同一次查表还会把无关行的 omitReasoningEffort: true 带进来,
    # 该标志优先于 supportsReasoningEffort, 会让 effort 整个从请求里消失 (glm-5.3-flash, kimi-k2.6, minimax-m3 实测)。
    modelOverrides:
      qwenworkcn/flash:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/pro:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/qwen3.8-max-preview:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/deepseek-v4.1-flash:
        reasoning: true
        thinking:
          mode: effort
          efforts: [high]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
