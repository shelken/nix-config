  embeddingModel: gemini-embedding-2
  embeddingApiUrl: https://generativelanguage.googleapis.com/v1beta
modelRoles:
  glm-flash: mp/workbuddy/glm-5.3-flash:max
  glm-max: mp/workbuddy/glm-5.3:high
  dsf: mp/workbuddy-ai/deepseek-v4.1-flash-sg:high
  gpt: mp/codex/gpt-6.1-sol:high
