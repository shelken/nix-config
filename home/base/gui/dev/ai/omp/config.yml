  reviewer-gemini: google-antigravity/gemini-3.8-flash:high
  reviewer-ds: "@dsf:high"
  reviewer-glm: "@glm-flash"
  reviewer-gpt: "@gpt:xhigh"
  vision: cpa/gpt-5.6-luna:high
  commit: cpa/workbuddy/hy3:high
  tiny: cpa/workbuddy/hy3:high
  memory: cpa/gpt-5.6-luna:high
  web: google/gemini-2.5-flash
  gog: google-antigravity/gemini-3.8-flash:high
