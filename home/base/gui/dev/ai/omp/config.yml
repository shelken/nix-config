  smol: "@glm-flash"
  scout: "@gpt:high"
  default: "@dsf"
  task: "@dsf"
  slow: "@gpt:high"
cycleOrder:
  - smol
  - task
  - default
  - gpt
  - gog
  - glm-flash
  - glm-max
  - dsf
symbolPreset: nerd
display:
  showTokenUsage: true
  showTurnTime: true
composer:
  shape: band
theme:
  dark: dark-catppuccin
setupVersion: 2
statusLine:
  showHookStatus: false
  compactThinkingLevel: false
  preset: custom
  transparent: true
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - status
    - token_rate
  rightSegments:
    - session_name
    - usage
task:
  agentModelOverrides:
    reviewer: "@reviewer-gemini"
    reviewer-general: "@reviewer-general"
    reviewer-gemini: "@reviewer-gemini"
    reviewer-ds: "@reviewer-ds"
    reviewer-glm: "@reviewer-glm"
    reviewer-gpt: "@reviewer-gpt"
    scout: "@scout"
