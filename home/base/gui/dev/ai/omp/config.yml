disabledProviders:
  - claude
  - claude-plugins
  - codex
  - opencode
  - gemini
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  llmMode: mem
  embeddingModel: gemini-embedding-2
  embeddingApiUrl: https://generativelanguage.googleapis.com/v1beta
  embeddingApiKey: ${OMP_EMBEDDING_API_KEY}
modelRoles:
  glm-flash: mp/qoder-cn/gfmodel:high
  glm-max: cpa/qwenworkcn/pro:high
  dsf: mp/qoder-cn/dfmodel:high
  qwen-flash: cpa/qwenworkcn/flash:high
  reviewer-general: "@dsf"
  reviewer-gemini: google-antigravity/gemini-3.8-flash:high
  reviewer-ds: "@dsf"
  reviewer-glm: cpa/workbuddy/glm-5.3-flash:high
  reviewer-gpt: mp/codex/gpt-6.1-sol:xhigh
  vision: cpa/gpt-6-luna:xhigh
  commit: cpa/workbuddy/hy3:high
  tiny: cpa/workbuddy/hy3:high
  mem: google-antigravity/gemini-3.8-flash:medium
  web: google/gemini-2.5-flash
  gog: google-antigravity/gemini-3.8-flash:high
  plan: "@reviewer-gpt"
  smol: "@glm-flash"
  default: "@dsf"
  task: "@dsf"
  slow: mp/codex/gpt-6.1-sol:xhigh
cycleOrder:
  - smol
  - task
  - default
  - slow
  - gog
  - glm-flash
  - glm-max
  - dsf
  - qwen-flash
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: dark-catppuccin
setupVersion: 2
statusLine:
  compactThinkingLevel: false
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
    - usage
task:
  agentModelOverrides:
    reviewer: "@reviewer-gemini"
    reviewer-general: "@reviewer-general"
    reviewer-gemini: "@reviewer-gemini"
    reviewer-ds: "@reviewer-ds"
    reviewer-glm: "@reviewer-glm"
    reviewer-gpt: "@reviewer-gpt"
  disabledAgents:
    []
browser:
  headless: true
  enabled: false
coAuthor:
  email: hakase@ooooo.space
skills:
  ignoredSkills:
    - ponytail-debt
    - ponytail-gain
    - ponytail-help
    - ponytail-audit
dev:
  autoqaConsent: granted
  autoqa: false
codexResets:
  autoRedeem: "no"
retry:
  fallbackChains:
    "commit":
      - google-antigravity/gemini-3.8-flash:medium
    "tiny":
      - google-antigravity/gemini-3.8-flash:medium
    "mem":
      - cpa/workbuddy/hy3:high
    "glm-flash":
      - mp/qoder-cn/gfmodel:high
      - mp/trae-cn/glm-5.3-flashx-max:high
      - mp/trae-cn/glm-5.3-flash-max:high
      - cpa/workbuddy/glm-5.3-flash:high
      - mp/workbuddy/glm-5.3-flash:high
      - zcode-local/glm-5.3-flash:high
    "glm-max":
      - cpa/qwenworkcn/pro:high
      - mp/qoder-cn/gmodel:high
      - cpa/workbuddy/glm-5.3:high
      - mp/trae-cn/glm-5.3-max
      - mp/workbuddy/glm-5.3:high
    "dsf":
      - mp/qoder-cn/dfmodel:high
      - cpa/workbuddy/deepseek-v4.1-flash:high
    "qwen-flash":
      - mp/trae-cn/qwen3.8-flash-max
      - cpa/qwenworkcn/flash:high
    web:
      - web/exa
      - web/brave
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-6-luna
      - xai/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - web/perplexity
      - google-antigravity/gemini-2.5-flash
      - xai-oauth/grok-4.5
      - web/ollama
compaction:
  methodOrder:
    - shake
    - snapcompact
    - handoff
    - soft
    - remote
grep:
  enabled: false
glob:
  enabled: false
tools:
  xdevInlineDevices:
    - context_prune
  xdevDocs: builtins
