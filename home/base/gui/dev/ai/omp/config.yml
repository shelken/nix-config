disabledProviders:
  - claude
  - claude-plugins
  - codex
  - opencode
  - gemini
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  embeddingModel: gemini-embedding-2
  embeddingApiUrl: https://generativelanguage.googleapis.com/v1beta
modelRoles:
  glm-flash: mp/qoder-cn/gfmodel:high
  glm-max: cpa/qwenworkcn/pro:high
  dsf: mp/qoder-cn/dfmodel:high
  reviewer-general: "@dsf"
  reviewer-gemini: google-antigravity/gemini-3.8-flash:high
  reviewer-ds: "@dsf"
  reviewer-glm: cpa/workbuddy/glm-5.3-flash:max
  reviewer-gpt: mp/codex/gpt-6.1-sol:xhigh
  vision: cpa/gpt-5.6-luna:high
  commit: cpa/workbuddy/hy3:high
  tiny: cpa/workbuddy/hy3:high
  memory: google-antigravity/gemini-3.8-flash:medium
  web: google/gemini-2.5-flash
  gog: google-antigravity/gemini-3.8-flash:high
  plan: "@reviewer-gpt"
  smol: "@glm-flash"
  default: "@dsf"
  task: "@dsf"
  slow: mp/codex/gpt-6.1-sol:xhigh
cycleOrder:
  - smol
  - task
  - default
  - slow
  - gog
  - glm-flash
  - glm-max
  - dsf
symbolPreset: nerd
display:
  showTokenUsage: true
  showTurnTime: true
composer:
  shape: band
theme:
  dark: dark-catppuccin
setupVersion: 2
statusLine:
  showHookStatus: false
  compactThinkingLevel: false
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - status
    - token_rate
    - cost
  rightSegments:
    - session_name
    - usage
task:
  agentModelOverrides:
    reviewer: "@reviewer-gemini"
    reviewer-general: "@reviewer-general"
    reviewer-gemini: "@reviewer-gemini"
    reviewer-ds: "@reviewer-ds"
    reviewer-glm: "@reviewer-glm"
    reviewer-gpt: "@reviewer-gpt"
  disabledAgents: []
browser:
  headless: true
  enabled: false
coAuthor:
  email: hakase@ooooo.space
skills:
  ignoredSkills:
    - ponytail-debt
    - ponytail-gain
    - ponytail-help
    - ponytail-audit
dev:
  autoqaConsent: granted
  autoqa: false
codexResets:
  autoRedeem: "no"
retry:
  fallbackChains:
    # context-prune
    "cpa/workbuddy/hy3":
      - cpa/gpt-5.6-luna:high
      - google-antigravity/gemini-3.8-flash:medium
    "cpa/gpt-5.6-luna":
      - cpa/workbuddy/hy3:high
      - google-antigravity/gemini-3.8-flash:medium
    commit:
      - google-antigravity/gemini-3.8-flash:medium
    tiny:
      - google-antigravity/gemini-3.8-flash:medium
    memory:
      - cpa/workbuddy/hy3:high
    glm-flash:
      - mp/qoder-cn/gfmodel:high
      - cpa/workbuddy/glm-5.3-flash:max
      - mp/workbuddy/glm-5.3-flash:max
      - zcode-local/glm-5.3-flash:high
    glm-max:
      - cpa/qwenworkcn/pro:high
      - mp/qoder-cn/gmodel:high
      - cpa/workbuddy/glm-5.3:high
      - mp/workbuddy/glm-5.3:high
    dsf:
      - mp/qoder-cn/dfmodel:high
      - cpa/workbuddy/deepseek-v4.1-flash:max
    web:
      - web/exa
      - web/brave
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-5.6-luna
      - xai/grok-4.5
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - web/perplexity
      - google-antigravity/gemini-2.5-flash
      - xai-oauth/grok-4.5
      - web/ollama
compaction:
  enabled: false
grep:
  enabled: false
glob:
  enabled: false
tools:
  xdevInlineDevices:
    - context_prune
  xdevDocs: builtins
