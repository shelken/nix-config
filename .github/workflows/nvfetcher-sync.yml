name: Sync nvfetcher Sources

on:
  schedule:
    - cron: "0 20 * * *" # Daily 04:00 AM Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

jobs:
  nvfetcher-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/nvfetcher-action-e2e

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run nvfetcher
        run: |
          nix develop --command nvfetcher -c nvfetcher.toml -o _sources

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            _sources/generated.json
            _sources/generated.nix
          branch: automation/nvfetcher-sync
          base: test/nvfetcher-action-e2e
          delete-branch: true
          commit-message: "chore(nvfetcher): sync _sources generated files"
          title: "chore(nvfetcher): sync _sources generated files"
          body: "Automated synchronization of nvfetcher sources."
