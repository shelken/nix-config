patch:
  __include: squirrel_catppuccin:/patch

  style:
    color_scheme: catppuccin
    color_scheme_dark: catppuccin

    candidate_list_layout: stacked
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    show_paging: false
    remember_size: false

    corner_radius: 10
    hilited_corner_radius: 0
    color_space: srgb
    border_height: 0
    border_width: 0
    line_spacing: 5
    spacing: 10
    line_length: 0

    font_face: "PingFang SC"
    font_point: 24
    label_font_point: 18
    comment_font_face: "PingFang SC"
    comment_font_point: 14
