patch:
  style:
    color_scheme: catppuccin_macchiato
    color_scheme_dark: catppuccin_macchiato

    candidate_list_layout: stacked # stacked | linear | tabled
    text_orientation: horizontal # horizontal | vertical
    inline_preedit: true
    inline_candidate: false
    show_paging: false
    remember_size: false

    corner_radius: 10
    hilited_corner_radius: 0
    color_space: srgb # srgb | display_p3
    border_height: 0
    border_width: 0
    line_spacing: 5
    spacing: 10
    line_length: 0

    font_face: "PingFang SC"
    font_point: 24
    label_font_point: 18
    comment_font_face: "PingFang SC"
    comment_font_point: 14

  # 颜色值是 BGR 顺序
  preset_color_schemes/catppuccin_macchiato:
    name: Catppuccin Macchiato
    translucency: true
    mutual_exclusive: false
    shadow_size: 0
    line_spacing: 5
    alpha: 1
    spacing: 10

    back_color: 0x261918
    border_color: 0x30201E
    text_color: 0xE0C0B8
    label_color: 0xCBADA5
    candidate_text_color: 0xF5D3CA
    hilited_back_color: 0xF6A0C6
    hilited_candidate_text_color: 0x3A2724
    hilited_candidate_label_color: 0x4F3A36
    hilited_text_color: 0x70B558
    hilited_comment_text_color: 0x4F3A36
    comment_text_color: 0x70B558
