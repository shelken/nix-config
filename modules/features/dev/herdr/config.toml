onboarding = false

[theme]
name = "catppuccin"

[worktrees]
directory = "~/Code/worktrees"

[keys]
prefix = "alt+x"
split_horizontal = "prefix+h"

focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

# navigate 模式：←→ 是内置保留键，关不掉；hjkl 显式清空
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "shelken.auto-pi.pick-session"
description = "pick pi session for cwd"

[[keys.command]]
key = "alt+a"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-agents"
description = "recent agents navigator"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "shelken.pi-float.pick-preset"
description = "pi-float: pick preset"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "file viewer tab"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "herdr-lazy: manage plugins"
