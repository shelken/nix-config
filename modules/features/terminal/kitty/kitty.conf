allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

font_family Iosevka Nerd Font Mono
font_size   18.0
symbol_map U+2E80-U+9FFF,U+F900-U+FAFF,U+FE30-U+FE4F,U+FF00-U+FFEF,U+20000-U+3FFFF Maple Mono NF CN
cursor_trail 3

background_opacity 0.88
background_blur 64

macos_show_window_title_in none
hide_window_decorations titlebar-only
window_padding_width 3 5 1 5

tab_bar_edge        bottom
tab_bar_style       separator
tab_separator       ""
tab_bar_min_tabs    2
tab_title_template  "  {fmt.fg._6e738d}{index} {fmt.fg.tab}{title.rsplit('/', 1)[-1]}  "
active_tab_title_template {fmt.fg._c6a0f6}{fmt.bg._181926}{fmt.bg.tab}{fmt.fg.tab} {index} {title.rsplit('/', 1)[-1]} {fmt.fg._c6a0f6}{fmt.bg._181926}

macos_option_as_alt yes
enabled_layouts splits,stack

map cmd+ctrl+,      load_config_file

map cmd+t           new_tab
map cmd+w           close_tab
map ctrl+shift+q    no_op

map cmd+shift+m     toggle_maximized
map cmd+shift+l     next_layout
map cmd+shift+f     show_scrollback

map cmd+c           copy_to_clipboard
map cmd+v           paste_from_clipboard
map cmd+shift+v     paste_from_selection

map cmd+enter       launch --location=hsplit --cwd=current
map cmd+shift+enter launch --location=vsplit --cwd=current

map cmd+[           previous_tab
map cmd+]           next_tab

map cmd+ctrl+up     move_window up
map cmd+ctrl+left   move_window left
map cmd+ctrl+right  move_window right
map cmd+ctrl+down   move_window down

map cmd+left        neighboring_window left
map cmd+right       neighboring_window right
map cmd+up          neighboring_window up
map cmd+down        neighboring_window down

map alt+shift+left  resize_window narrower 2
map alt+shift+right resize_window wider 2
map alt+shift+up    resize_window taller 2
map alt+shift+down  resize_window shorter 2

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
