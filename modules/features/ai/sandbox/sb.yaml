# Agent 沙箱主 VM 能力上限配置 (sb.yaml)
# 本文件声明主 VM (sb-main) 的能力上限。
# 挂载根目录在 guest 内的路径与宿主保持绝对一致。

image: "ubuntu"
cpus: 4
memory: "8G"

# 命名数据卷（用于 /data，ext4 disk）
volume:
  name: "sb-main-data"
  size: "8G"

# 挂载根目录清单（宿主与 guest 内路径保持绝对一致）
mount_roots:
  - "${HOME}/Code"
  - "${HOME}/nix-config"
  - "${HOME}/.herdr/worktrees"

# VM 级网络策略：公网 + DNS + 私网 + 宿主端口。私网在这一层整体放开，逐项限制由每个
# 执行上下文自己的 iptables 链完成：只有 sb.yaml 的 default_grant 与已批准（sb trust）的
# .sandbox.yaml 声明的目标才放行。不在上下文里运行的 guest 进程（如 sb sync）不受上下文链约束，
# 也能连私网。改这一段会改变上限指纹、触发重建；授权的增减不会
network:
  policy: "public"
  allow:
    - "public"
    - "dns"
    - "private"
    - "host:tcp:3425"
    - "host:tcp:8080"
  # 所有执行上下文默认放行的私网 IP:端口：家里的模型服务
  default_grant:
    - "192.168.69.46:443"

# Secret 全局声明：allow 是真实值的替换目标；passthrough 是占位符的放行目标
# 占位符 $MSB_<名字> 一旦进入对话（读到含它的文件或文档、跑 env），就会随每轮请求体发往模型服务。
# msb 对发往 allow 之外目标的占位符默认拦截并切断连接，表现为首字节前 ECONNRESET。
# 占位符本身不含凭据，原样放行到任何目标不会泄露凭据；真实值仍只替换给 allow 里的目标
secrets:
  GITHUB_TOKEN:
    allow:
      - "github.com"
      - "api.github.com"
    passthrough:
      - "*"
  CPA_PI_API_KEY:
    allow:
      - "cpa.int.ooooo.space"
    passthrough:
      - "*"
  COMMANDCODE_API_KEY:
    allow:
      - "commandcode.int.ooooo.space"
    passthrough:
      - "*"
  WX_PI_API_KEY:
    allow:
      - "chatapi.weixin.qq.com"
    passthrough:
      - "*"
