image: "ubuntu"
cpus: 4
memory: "8G"

# 最后一个 omp-sb / sb run 退出后空闲多久，msb 自动停止主 VM，免得忘了 sb down；下次启动自动拉起。
# 只有附着的 exec 会话算活跃；msb 只在创建时应用它，改了会让上限指纹变化（空闲时下次启动重建）。不写则不自动停止
idle_timeout: "5m"

volume:
  name: "sb-main-data"
  size: "8G"

mount_roots:
  - "${HOME}/Code"
  - "${HOME}/nix-config"
  # 临时目录也能作项目根；写真实路径，macOS 的 /tmp 是指向它的符号链接
  - "/private/tmp"

network:
  policy: "public"
  allow:
    - "public"
    - "dns"
    - "private"
  default_grant:
    - "192.168.69.46:443"

# Secret 全局声明：allow 是真实值的替换目标；passthrough 是占位符的放行目标
secrets:
  GITHUB_TOKEN:
    allow:
      - "github.com"
      - "api.github.com"
    passthrough:
      - "*"
  AGENT_GITHUB_TOKEN:
    allow:
      - "github.com"
      - "api.github.com"
    passthrough:
      - "*"
  CPA_PI_API_KEY:
    allow:
      - "cpa.int.ooooo.space"
    passthrough:
      - "*"
  MAGPIE_API_KEY:
    allow:
      - "magpie.int.ooooo.space"
    passthrough:
      - "*"
