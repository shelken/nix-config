image: "ubuntu"
cpus: 4
memory: "8G"
workdir: "/workspace"

mounts:
  - "${HOME}/Code:/workspace"
  - named: sb-default-omp
    target: /data
  - "${HOME}/.config/sandbox:/run/sandbox-config:ro,stat-virt=relaxed"
  - "${HOME}/nix-config:${HOME}/nix-config"
  - "${HOME}/Data/sandboxes/mise/aarch64-linux:/opt/sandbox-mise"
  - "/nix/store:/nix/store:ro,stat-virt=relaxed"

patches:
  - symlink: { target: "/run/sandbox-config/current/.omp", link: "/root/.omp" }
  - symlink: { target: "/run/sandbox-config/current/.agents", link: "/root/.agents" }

network:
  policy: "public"
  allow:
    - "public"
    - "dns"
    - "host:tcp:3425"
    - "host:tcp:8080"
    - "192.168.69.46"
    # - "192.168.69.60"

secrets:
  GITHUB_TOKEN:
    allow: ["github.com", "api.github.com"]
  CPA_PI_API_KEY:
    allow: ["cpa.int.ooooo.space"]
  COMMANDCODE_API_KEY:
    allow: ["commandcode.int.ooooo.space"]
  WX_PI_API_KEY:
    allow: ["chatapi.weixin.qq.com"]
