disabledProviders:
  - claude
  - claude-plugins
  - codex
  - opencode
  - gemini
memory:
  backend: "off"
mnemopi:
  scoping: per-project-tagged
  embeddingModel: gemini-embedding-2
  embeddingApiUrl: https://generativelanguage.googleapis.com/v1beta
modelRoles:
  glm-flash: cpa/workbuddy/glm-5.3-flash:max
  glm-max: cpa/workbuddy/glm-5.3:high
  dsf: mp/opencode-zen/deepseek-v4.1-flash-free:high
  gpt: mp/codex/gpt-6.2-sol:high
  gpt-lite: mp/codex/gpt-5.6-luna:max
  claude-lite: anthropic/claude-haiku-5-5:max
  claude: anthropic/claude-sonnet-5-5:high
  claude-max: anthropic/claude-opus-5-5:medium
  fable: anthropic/claude-opus-5-5:medium
  gemini-lite: mp/agy-cli/gemini-4-hydrogen:high
  gemini: mp/agy-cli/gemini-4-neon:high
  gemini-max: mp/agy-cli/gemini-4-neon:high
  reviewer-gemini: "@gemini-max"
  reviewer-ds: "@dsf"
  reviewer-glm: "@glm-max:high"
  reviewer-gpt: "@gpt:xhigh"
  reviewer-cc: "@claude"
  reviewer: "@reviewer-gpt"
  judge: "@gemini-max"
  vision: cpa/gpt-5.6-luna:high
  commit: cpa/workbuddy/hy3:high
  tiny: cpa/workbuddy/hy3:high
  memory: cpa/gpt-5.6-luna:high
  web: google/gemini-2.5-flash
  plan: "@reviewer-gpt"
  smol: "@gpt-lite"
  scout: "@gemini-lite"
  default: "@gemini"
  task: "@gemini"
  slow: "@gpt:high"
cycleOrder:
  - smol
  - task
  - default
  - claude-max
  - gpt
  - glm-flash
  - glm-max
  - dsf
symbolPreset: nerd
display:
  showTokenUsage: true
  showTurnTime: true
composer:
  shape: band
theme:
  dark: dark-catppuccin
setupVersion: 3
statusLine:
  showHookStatus: false
  compactThinkingLevel: false
  preset: custom
  transparent: true
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - status
    - token_rate
  rightSegments:
    - session_name
    - usage
task:
  agentModelOverrides:
    reviewer: "@reviewer"
    reviewer-gemini: "@reviewer-gemini"
    reviewer-ds: "@reviewer-ds"
    reviewer-glm: "@reviewer-glm"
    reviewer-gpt: "@reviewer-gpt"
    reviewer-cc: "@reviewer-cc"
    task-gpt: "@gpt:high"
    task-gemini: "@gemini"
    task-glm: "@glm-flash"
    judge: "@judge"
    poteto-agent: "@task"
    comment-sicko: "@gemini-lite"
    scout: "@scout"
  disabledAgents: []
  completionProbe: false
browser:
  headless: true
  enabled: false
coAuthor:
  email: hakase@ooooo.space
skills:
  ignoredSkills:
    - ponytail-debt
    - ponytail-gain
    - ponytail-help
    - ponytail-audit
dev:
  autoqaConsent: granted
  autoqa: false
codexResets:
  autoRedeem: "no"
retry:
  fallbackChains:
    scout:
      - mp/agy-cli/gemini-3.8-flash:high
      - cpa/workbuddy/glm-5.3:max
    cpa/workbuddy/hy3:
      - cpa/gpt-5.6-luna:high
      - mp/agy-cli/gemini-3.8-flash:medium
    cpa/gpt-5.6-luna:
      - mp/agy-cli/gemini-3.8-flash:medium
      - cpa/workbuddy/hy3:high
    commit:
      - mp/agy-cli/gemini-3.8-flash:medium
    tiny:
      - mp/agy-cli/gemini-3.8-flash:medium
    memory:
      - cpa/workbuddy/hy3:high
    glm-flash:
      - mp/loomy/GLM-5.3-Flash:high
      - cpa/workbuddy/glm-5.3-flash:max
    glm-max:
      - cpa/workbuddy/glm-5.2:medium
      - cpa/workbuddy/glm-5.3:high
    dsf:
      - mp/opencode-zen/deepseek-v4.1-flash-free:high
      - cpa/workbuddy/deepseek-v4.1-flash:max
    web:
      - web/exa
      - web/brave
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - web/perplexity
      - web/ollama
compaction:
  experimentalContextManagement: true
  methodOrder:
    - shake
    - soft
grep:
  enabled: false
glob:
  enabled: false
todo:
  reminders: false
recap:
  enabled: false
update:
  auto: false
