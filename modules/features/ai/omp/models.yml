providers:
  anthropic:
    baseUrl: https://cpa.int.ooooo.space
    apiKey: CPA_PI_API_KEY
    api: anthropic-messages
  mp:
    baseUrl: https://magpie.int.ooooo.space/v1
    api: openai-responses
    apiKey: MAGPIE_API_KEY
    discovery:
      type: openai-models-list
      timeoutMs: 3000
    # >>> mp-modelOverrides:auto-sync >>>
    modelOverrides:
      opencode-zen/gemini-3.5-flash-lite:
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high]
    # <<< mp-modelOverrides:auto-sync <<<
  cpa:
    baseUrl: https://cpa.int.ooooo.space/v1
    apiKey: CPA_PI_API_KEY
    api: openai-responses
    discovery:
      type: openai-models-list
      timeoutMs: 3000
    # 2. compat.supportsReasoningEffort: true & compat.omitReasoningEffort: false (必须成对出现):
    #    - 原因: 宿主 /v1/models 仅返回 id/object, 无能力字段; omp 发现后查内置 catalog 盲目碰撞同名行,
    #      会继承到无关第三方平台的 omitReasoningEffort: true 或 supportsReasoningEffort: false。
    #    - 源码行为: 若 omitReasoningEffort=true 或 supportsReasoningEffort=false, omp 会在 wire 序列化时直接把 reasoning.effort 抹除,
    #      只发 { summary: "auto" }, 导致上游根本收不到 effort (glm-5.3-flash, kimi-k2.6, minimax-m3 实测)。故必须显式钉死。
    # 3. thinking.requiresEffort: true (仅对纯思考 onlyReasoning: true 模型必须):
    #    - 原因: 对应 omp 客户端的 Mandatory-reasoning 保护机制 (stream.ts normalizeMandatoryReasoningOptions)。
    #      当上游模型是强制思考模型 (无非思考模式) 时, 若用户客户端手滑关闭思考或未带档位, omp 会自动保底 clamp 到默认/最低档位, 防止上游 400 报错。
    #    - 注意: 混合模型 (如 deepseek-v4-flash 本身支持关思考) 绝对不要加此参数, 否则会剥夺用户关闭思考的自由 (被强行拉回 high)。
    modelOverrides:
      gemini-3.8-flash:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high]
          defaultLevel: high
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/flash:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/pro:
        name: GLM-5.2
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/qwen3.8-max-preview:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/deepseek-v4.1-flash:
        reasoning: true
        input: ["text", "image"]
        thinking:
          mode: effort
          efforts: [high, xhigh, max]
          defaultLevel: max
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/deepseek-v4-flash:
        reasoning: true
        thinking:
          mode: effort
          efforts: [high, xhigh]
          defaultLevel: xhigh
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.2:
        reasoning: true
        thinking:
          mode: effort
          efforts: [medium, high, xhigh]
          defaultLevel: medium
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.3-flash:
        reasoning: true
        input: ["text", "image"]
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/hy3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/hy4-preview:
        reasoning: true
        thinking:
          mode: effort
          efforts: [high]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/kimi-k3-1:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, xhigh]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
          # 内置 catalog 的 kimi k3 lineage 映射会把 xhigh 翻成 max (厂商表里没有 max), 这里钉回原值。
          reasoningEffortMap: { xhigh: xhigh }
      workbuddy/minimax-m3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [medium]
          defaultLevel: medium
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
