        name: "Seed-2.1-Pro-0915"
      trae-cn/Doubao-Seed-2.1-Pro-max:
        name: "Seed-2.1-Pro-0915 (Max)"
      trae-cn/glm-5.3-flash-max:
        name: "GLM-5.3-Flash (Max)"
      trae-cn/glm-5.3-flashx-max:
        name: "GLM-5.3-FlashX (Max)"
      trae-cn/glm-5.3-max:
        name: "GLM-5.3 (Max)"
      trae-cn/glm-5.2-max:
        name: "GLM-5.2 (Max)"
      trae-cn/deepseek-v4.1-flash-max:
        name: "DeepSeek-V4.1-Flash (Max)"
      trae-cn/minimax-m3-max:
        name: "MiniMax-M3 (Max)"
      trae-cn/qwen3.8-flash-max:
        name: "Qwen3.8-Flash (Max)"
      trae-cn/kimi-k3-auto-max:
        name: "Kimi-K3 (Max)"
        input: ["text", "image"]
      opencode-zen-free/nemotron-3.5-super-vl-free:
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
      loomy/spark-x2.6:
        name: "Spark-X2.6 正式版(限时免费)"
      loomy/spark-x:
        name: "Spark-X2.5（限时免费）"
      loomy/qwen-3.8-max:
        name: "Qwen 3.8 Max"
      loomy/auto:
        name: "自动 · 均衡"
        input: ["text"]
    # <<< mp-modelOverrides:auto-sync <<<
  cpa:
    # cpa 端点锚点(openai/cpa 两 provider 共用): 外出 localhost, 回家改回 https://cpa.int.ooooo.space/v1
    baseUrl: https://cpa.int.ooooo.space/v1
    # baseUrl: http://localhost:8317/v1
    apiKey: CPA_PI_API_KEY
    api: openai-responses
    discovery:
      type: openai-models-list
      timeoutMs: 3000
    # <<: *cpa-endpoint
    # === 覆盖原则与参数必要性说明 ===
    # 1. 覆盖原则: 仅对 omp 无法映射、或映射错误 (如丢失思考、档位错误/与上游对不上) 的常用模型做覆盖; 不常用/不值得的模型不列入, 保持精简。
    # 2. compat.supportsReasoningEffort: true & compat.omitReasoningEffort: false (必须成对出现):
    #    - 原因: 宿主 /v1/models 仅返回 id/object, 无能力字段; omp 发现后查内置 catalog 盲目碰撞同名行,
    #      会继承到无关第三方平台的 omitReasoningEffort: true 或 supportsReasoningEffort: false。
    #    - 源码行为: 若 omitReasoningEffort=true 或 supportsReasoningEffort=false, omp 会在 wire 序列化时直接把 reasoning.effort 抹除,
    #      只发 { summary: "auto" }, 导致上游根本收不到 effort (glm-5.3-flash, kimi-k2.6, minimax-m3 实测)。故必须显式钉死。
    # 3. thinking.requiresEffort: true (仅对纯思考 onlyReasoning: true 模型必须):
    #    - 原因: 对应 omp 客户端的 Mandatory-reasoning 保护机制 (stream.ts normalizeMandatoryReasoningOptions)。
    #      当上游模型是强制思考模型 (无非思考模式) 时, 若用户客户端手滑关闭思考或未带档位, omp 会自动保底 clamp 到默认/最低档位, 防止上游 400 报错。
    #    - 注意: 混合模型 (如 deepseek-v4-flash 本身支持关思考) 绝对不要加此参数, 否则会剥夺用户关闭思考的自由 (被强行拉回 high)。
    # 4. compat.reasoningEffortMap (按需配置):
    #    - 原因: 当 omp 内部规范档位名与上游实际接收枚举不一致时使用 (例如 kimi-k3-1 上游是 xhigh, omp catalog 默认翻译成 max 导致 400, 需钉回 xhigh: xhigh)。
    # 档位权威来源: 各插件 data/static-config.json
    modelOverrides:
      qwenworkcn/flash:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/pro:
        name: GLM-5.2
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      qwenworkcn/qwen3.8-max-preview:
        contextWindow: 1000000
        maxTokens: 128000
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/deepseek-v4.1-flash:
        reasoning: true
        input: ["text", "image"]
        thinking:
          mode: effort
          efforts: [high, xhigh, max]
          defaultLevel: max
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/deepseek-v4-flash:
        reasoning: true
        thinking:
          mode: effort
          efforts: [high, xhigh]
          defaultLevel: xhigh
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.2:
        reasoning: true
        thinking:
          mode: effort
          efforts: [medium, high, xhigh]
          defaultLevel: medium
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/glm-5.3-flash:
        reasoning: true
        input: ["text", "image"]
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/hy3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/hy4-preview:
        reasoning: true
        thinking:
          mode: effort
          efforts: [high]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
      workbuddy/kimi-k3-1:
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, xhigh]
          defaultLevel: high
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
          # 内置 catalog 的 kimi k3 lineage 映射会把 xhigh 翻成 max (厂商表里没有 max), 这里钉回原值。
          reasoningEffortMap: { xhigh: xhigh }
      workbuddy/minimax-m3:
        reasoning: true
        thinking:
          mode: effort
          efforts: [medium]
          defaultLevel: medium
          requiresEffort: true
        compat:
          supportsReasoningEffort: true
          omitReasoningEffort: false
