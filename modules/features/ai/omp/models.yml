    apiKey: magpie
    discovery:
      type: openai-models-list
      timeoutMs: 3000
    # >>> mp-modelOverrides:auto-sync >>>
    modelOverrides:
      qoder-cn/qfmodel:
        name: "Qwen3.8-Flash"
