        input: ["text", "image"]
      workbuddy/hy4-preview:
        input: ["text", "image"]
      workbuddy/hy3:
        input: ["text", "image"]
      workbuddy/glm-5.3:
        input: ["text", "image"]
      workbuddy/glm-5.2:
        input: ["text", "image"]
      workbuddy/kimi-k3-1:
        name: "Kimi-K3"
        input: ["text", "image"]
      workbuddy-ai/hy3:
        input: ["text", "image"]
      workbuddy-ai/deepseek-v4.1-flash-sg:
