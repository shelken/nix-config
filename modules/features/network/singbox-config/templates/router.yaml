# invert 反转整条规则，所以「排除白名单」必须两层：外层 AND 限定 inbound: tun-in，
# 内层只反转源 IP 条件。写在同一层会把 dns-in 的查询也翻成命中。
# 白名单按源 IP 匹配：透明 DNS 在 auto_redirect 预匹配阶段取不到源 MAC。
# 内核 merge 不校验 CIDR，且把单元素数组写成标量，所以占位符直接写成标量。
# route.rules 顺序是固定的：放行解析器 → 53 劫持 → 白名单 bypass。白名单 bypass
# 匹配的是「不在名单里」的整台设备，排在 53 劫持之前会把名单外设备的 DNS 一起放走。
subs:
  - "{{ op://Projects/proxy/subs-miaona }}"
nodes:
  - "{{ op://Projects/proxy/vps-hy2 }}"
  - "{{ op://Projects/proxy/vps-hy2-v6 }}"
  - "{{ op://Projects/proxy/vps-anytls }}"
template_url: https://raw.githubusercontent.com/shelken/proxy/main/config/sing-box/template-router.json
overlay: |
  {
    "services": [
      {
        "type": "api",
        "tag": "rpc-api",
        "listen": "0.0.0.0",
        "listen_port": 9091,
        "secret": "{{ op://Projects/proxy/clash-secret }}"
      }
    ],
    "experimental": {
      "clash_api": {
        "external_controller": "0.0.0.0:9090",
        "secret": "{{ op://Projects/proxy/clash-secret }}"
      }
    },
    "dns": {
      "servers": [{ "type": "udp", "tag": "dns-lan", "server": "192.168.6.1" }],
      "rules": [
        {
          "invert": true,
          "server": "dns-lan",
          "source_ip_cidr": "@whitelist@"
        }
      ]
    },
    "route": { "rules": [
      {
        "inbound": ["tun-in"],
        "ip_cidr": ["223.5.5.5/32"],
        "port": [53],
        "network": ["udp", "tcp"],
        "action": "bypass",
        "outbound": "direct"
      },
      {
        "inbound": ["tun-in"],
        "port": [53],
        "network": ["udp", "tcp"],
        "action": "hijack-dns"
      },
      {
        "type": "logical",
        "mode": "and",
        "rules": [
          { "inbound": ["tun-in"] },
          {
            "type": "logical",
            "mode": "and",
            "invert": true,
            "rules": [
              {
                "source_ip_cidr": "@whitelist@"
              }
            ]
          }
        ],
        "action": "bypass",
        "outbound": "direct"
      }
    ] }
  }
