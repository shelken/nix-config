# route.rules 顺序固定：本机 bypass → 放行解析器 → 53 劫持。
# 本机源 IP（eth0 与 tun-in 地址）直接放行，避免系统更新、NTP 与拉取订阅进入代理。
# 谁走旁路由由主路由 DHCP tag 或设备网关决定，不再在 sing-box 维护设备白名单。
subs:
  - "{{ op://Projects/proxy/subs-miaona }}"
nodes:
  - "{{ op://Projects/proxy/vps-hy2 }}"
  - "{{ op://Projects/proxy/vps-hy2-v6 }}"
  - "{{ op://Projects/proxy/vps-anytls }}"
template_url: https://raw.githubusercontent.com/shelken/proxy/main/config/sing-box/template-router.json
overlay: |
  {
    "services": [
      {
        "type": "api",
        "tag": "rpc-api",
        "listen": "0.0.0.0",
        "listen_port": 9091,
        "secret": "{{ op://Projects/proxy/clash-secret }}"
      }
    ],
    "experimental": {
      "clash_api": {
        "external_controller": "0.0.0.0:9090",
        "secret": "{{ op://Projects/proxy/clash-secret }}"
      }
    },
    "dns": {
      "servers": [{ "type": "udp", "tag": "dns-lan", "server": "192.168.6.1" }]
    },
    "route": {
      "rules": [
        {
          "inbound": ["tun-in"],
          "source_ip_cidr": [
            "192.168.6.3/32",
            "198.51.100.1/30",
            "fdfe:dcba:9876::1/126"
          ],
          "action": "bypass",
          "outbound": "direct"
        },
        {
          "inbound": ["tun-in"],
          "ip_cidr": ["223.5.5.5/32"],
          "port": [53],
          "network": ["udp", "tcp"],
          "action": "bypass",
          "outbound": "direct"
        },
        {
          "inbound": ["tun-in"],
          "port": [53],
          "network": ["udp", "tcp"],
          "action": "hijack-dns"
        }
      ]
    }
  }
